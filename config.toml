[binance]
symbols = ["btcusdt", "ethusdt", "solusdt", "xrpusdt"]

[polymarket]
symbols = ["btc", "eth", "sol", "xrp"]

[directional]
enabled = true
directional_threshold_bps = 25.0
max_entry_price = 0.92
momentum_window_secs = 30
min_time_into_window_secs = 60
max_time_before_close_secs = 120
cooldown_secs = 30
fair_value_sensitivity = 0.008
trade_size = 10.0

[sniping]
enabled = true
spike_threshold_bps = 15.0
spike_window_secs = 5
max_entry_price = 0.92
staleness_max_ms = 2000
fair_value_sensitivity = 0.008
trade_size = 10.0

[fees]
rate = 0.25
exponent = 2

[latency]
simulated_order_delay_ms = 10

[logging]
binance_ticks = false           # ~230MB/hr, disable for 24h runs
polymarket_snapshots = false    # ~1.5GB/hr, disable for 24h runs
evaluations = false             # ~420MB/hr, disable for 24h runs
mock_trades = true              # tiny — only actual trades
signals = true                  # tiny — only fired signals
latency_csv = true              # ~23MB/hr, manageable

[general]
run_duration_secs = 86400
log_dir = "./logs"
